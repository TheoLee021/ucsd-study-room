name: Publish to PyPI

# Publishes when a merge to main carries a version (pyproject.toml) not yet on PyPI.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check whether this version is already on PyPI
        id: version
        run: |
          ver="$(uv version --short)"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          status="$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/ucsd-study-room/$ver/json")"
          case "$status" in
            200) echo "publish=false" >> "$GITHUB_OUTPUT"; echo "v$ver is already on PyPI; nothing to publish." ;;
            404) echo "publish=true" >> "$GITHUB_OUTPUT"; echo "v$ver is new; publishing." ;;
            *) echo "Unexpected PyPI response: $status"; exit 1 ;;
          esac

  publish:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uv publish
      - name: Tag the release
        env:
          TAG: v${{ needs.check.outputs.version }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
